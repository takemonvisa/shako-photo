<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<meta name="robots" content="noindex"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Hiragino Sans",sans-serif;background:#f4f6f8;color:#1a1a1a;font-size:18px}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
label{display:block;font-size:14px;color:#555;margin:10px 0 4px}
input[type=text],input[type=date],input[type=time]{width:100%;font-size:18px;padding:10px;border:1px solid #bbb;border-radius:8px;background:#fff}
.ro{background:#eef1f4}
.btn{display:block;width:100%;font-size:20px;font-weight:bold;padding:16px;border:0;border-radius:12px;margin-top:8px}
.photo{background:#1976d2;color:#fff}.send{background:#2e7d32;color:#fff}.send[disabled]{background:#9e9e9e}
#pv{display:none;width:100%;border-radius:8px;margin-top:10px}
.msg{padding:12px;border-radius:8px;margin-top:10px;font-size:17px;display:none}
.err{background:#ffebee;color:#b71c1c}.ok{background:#e8f5e9;color:#1b5e20;font-size:22px;text-align:center}
.note{font-size:14px;color:#555}
</style><title>現場記録</title></head><body><div class="wrap">
<h1 id="title"></h1>
<div class="card" id="main">
<div id="note" class="note"></div>
<label>車台番号</label><input type="text" id="chassis">
<label>警察署名</label><input type="text" id="police">
<label>お客様名</label><input type="text" id="name">
<div id="f_uke" style="display:none"><label>受付日</label><input type="date" id="uketsuke"><label>交付日（受付票に書いてある日）</label><input type="date" id="koufu"></div>
<div id="f_nouhin" style="display:none"><label>納品先の担当者名</label><input type="text" id="tantou" value="伊東"><label>納品日</label><input type="date" id="nouhinDate"><label>納品時刻</label><input type="time" id="nouhinTime"></div>
<div id="f_track" style="display:none"><label id="trackLabel">追跡番号（写真が使えないときだけ手入力）</label><input type="text" id="tracking" inputmode="numeric"></div>
<input type="file" id="file" accept="image/*" style="display:none">
<button class="btn photo" id="pick" type="button">📷 写真を撮る／選ぶ</button>
<img id="pv" alt="">
<div class="msg err" id="err"></div>
<button class="btn send" id="send" type="button" disabled>送信する</button>
</div>
<div class="msg ok" id="done">✓ 送信できました<br><span style="font-size:15px">このページは閉じて大丈夫です</span></div>
</div>
<script>
var GAS_URL="https://script.google.com/macros/s/AKfycbysODh739EQsx-ok026mPylaCqP5dLD1ts8PABv4Da0b5ZkSaIeRKtj4rPg6qTmN-OsZA/exec";
var QS=new URLSearchParams(location.search);
var INIT={t:QS.get("t")||"",c:QS.get("v")||"",p:QS.get("s")||"",n:QS.get("m")||""};
var CFG={
 uke:{title:"① 受付票を送る",note:"受付票の写真を撮り、受付日と交付日を入れて送信します。",photo:true},
 kyokasho:{title:"② 許可証を送る",note:"許可証の「車台番号」がはっきり読めるように、真上から、ブレずに撮ってください。",photo:true},
 nouhin:{title:"③ 納品を記録する",note:"レタパ番号と許可証が一緒に写るように撮ってください。",photo:true,track:"レタパ追跡番号（わかれば）"},
 soufu:{title:"④ 外注に納品する（レタパ番号）",note:"レターパックの「お問い合わせ番号」が読めるように撮ってください。",photo:true,track:"追跡番号（写真が使えないときだけ手入力）"}
};
var cfg=CFG[INIT.t]; var photoB64=null, photoMime="image/jpeg";
function $(i){return document.getElementById(i)}
function pad(n){return (n<10?"0":"")+n}
function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function nowTime(){var d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())}
function showErr(m){var e=$("err");e.textContent=m;e.style.display=m?"block":"none"}
if(!cfg){$("title").textContent="QRを読み直してください";$("main").style.display="none"}else{
 $("title").textContent=cfg.title;$("note").textContent=cfg.note;
 $("chassis").value=INIT.c||"";$("police").value=INIT.p||"";$("name").value=INIT.n||"";
 if(INIT.c){$("chassis").className="ro";$("chassis").readOnly=true}
 if(INIT.t==="uke"){$("f_uke").style.display="block";$("uketsuke").value=today()}
 if(INIT.t==="nouhin"){$("f_nouhin").style.display="block";$("nouhinDate").value=today();$("nouhinTime").value=nowTime()}
 if(cfg.track){$("f_track").style.display="block";$("trackLabel").textContent=cfg.track}
}
$("pick").onclick=function(){$("file").click()};
$("file").onchange=function(){
 var f=this.files[0]; if(!f)return; showErr(""); $("send").disabled=true; $("pick").textContent="写真を準備しています…";
 var url=URL.createObjectURL(f), img=new Image();
 img.onload=function(){
  var w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,2000/Math.max(w,h));
  var cv=document.createElement("canvas");cv.width=Math.round(w*s);cv.height=Math.round(h*s);
  cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
  var d=cv.toDataURL("image/jpeg",0.85);photoB64=d.split(",")[1];photoMime="image/jpeg";
  $("pv").src=d;$("pv").style.display="block";$("pick").textContent="📷 撮り直す／選び直す";$("send").disabled=false;URL.revokeObjectURL(url)};
 img.onerror=function(){
  var r=new FileReader();r.onload=function(){var d=String(r.result);photoB64=d.split(",")[1];photoMime=f.type||"image/jpeg";
   $("pv").style.display="none";$("pick").textContent="📷 撮り直す／選び直す（選択済み）";$("send").disabled=false};r.readAsDataURL(f)};
 img.src=url};
$("send").onclick=function(){
 showErr("");
 var p={t:INIT.t,chassis:$("chassis").value,police:$("police").value,name:$("name").value,photo:photoB64,mime:photoMime,
  uketsuke:$("uketsuke").value,koufu:$("koufu").value,tantou:$("tantou").value,nouhinDate:$("nouhinDate").value,nouhinTime:$("nouhinTime").value,tracking:$("tracking").value};
 $("send").disabled=true;$("send").textContent="送信中…（そのままお待ちください）";
 var ctl=new AbortController();var tm=setTimeout(function(){ctl.abort()},120000);
 fetch(GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(p),signal:ctl.signal,credentials:"omit"})
 .then(function(r){return r.json()})
 .then(function(j){clearTimeout(tm);
  if(j&&j.ok){$("main").style.display="none";$("done").style.display="block";window.scrollTo(0,0)}
  else{showErr("送信できませんでした："+(j&&j.error?j.error:"不明なエラー"));$("send").disabled=false;$("send").textContent="送信する"}})
 .catch(function(e){clearTimeout(tm);showErr("送信できませんでした。電波を確認して、もう一度「送信する」を押してください。");$("send").disabled=false;$("send").textContent="送信する"});};
</script></body></html>
